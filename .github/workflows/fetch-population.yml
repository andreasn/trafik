name: Fetch data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe Trafikanalys (temporary)
        run: python3 -u scripts/probe_trafa.py

      - name: Stop before fetching (temporary)
        run: exit 1

      - name: Fetch population from SCB
        run: python3 -u scripts/fetch_population.py

      - name: Fetch passenger cars from SCB
        run: python3 -u scripts/fetch_cars.py

      - name: Fetch municipality populations from SCB
        run: python3 -u scripts/fetch_municipalities.py

      - name: Fetch passenger cars per municipality from SCB
        run: python3 -u scripts/fetch_municipal_cars.py

      - name: Fetch distance driven from Trafikanalys
        run: python3 -u scripts/fetch_traffic.py

      - name: Fetch distance driven per county from Trafikanalys
        run: python3 -u scripts/fetch_county_distance.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/population.json data/cars.json data/municipalities.json data/municipal_cars.json data/traffic.json data/county_distance.json
          git diff --cached --quiet || git commit -m "Update data from SCB and Trafikanalys"
          git push
