name: Fetch SCB data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch population from SCB
        run: python3 -u scripts/fetch_population.py

      - name: Fetch passenger cars from SCB
        run: python3 -u scripts/fetch_cars.py

      - name: Fetch municipality populations from SCB
        run: python3 -u scripts/fetch_municipalities.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/population.json data/cars.json data/municipalities.json
          git diff --cached --quiet || git commit -m "Update data from SCB"
          git push
