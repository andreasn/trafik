<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffic Data Sweden</title>
  <link rel="stylesheet" href="style.css">
  <script src="cars.js" defer></script>
</head>
<body>
  <main>
    <h1>Traffic Data Sweden</h1>

    <section aria-labelledby="cars-heading">
      <h2 id="cars-heading">Passenger cars in Sweden, 1975–2025</h2>
      <p id="cars-summary" class="lead">Loading data from Statistics Sweden…</p>

      <figure class="chart">
        <figcaption>Passenger cars in traffic at the end of the year</figcaption>
        <div id="cars-chart" class="chart-plot"></div>
      </figure>

      <figure class="chart">
        <figcaption>Passenger cars in traffic per 1,000 inhabitants</figcaption>
        <div id="density-chart" class="chart-plot"></div>
      </figure>

      <table id="cars-table">
        <caption>Passenger cars and population, five-year intervals</caption>
        <thead>
          <tr>
            <th scope="col">Year</th>
            <th scope="col" class="num">Cars in traffic</th>
            <th scope="col" class="num">Population</th>
            <th scope="col" class="num">Cars per 1,000</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="cars-source" class="source"></p>
    </section>
  </main>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
</body>
</html>
